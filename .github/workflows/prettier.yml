name: ✨ Prettier lint check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - name: ⏭️ Checkout
        uses: actions/checkout@v5

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Installing dependencies
        run: npm ci

      - name: ✨ Checking
        run: npm run format:check
